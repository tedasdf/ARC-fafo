# Full training on the original eight pilot tasks: 1500 updates, seed 42.
# Fixed budget: the current trainer does not implement legacy early stopping.
experiment:
  name: all_projected_triton_lse_pilot8
  task_ids:
    - "0dfd9992"
    - "22eb0ac0"
    - "239be575"
    - "50cb2852"
    - "54d82841"
    - "623ea044"
    - "c1d99e64"
    - "ec883f72"
model:
  shift_implementation: tied_conv
  direction_share_implementation: d4
  direction_share_dim: 8
  cummax_implementation: triton
  multitensor_constraints: strict
  lse_tau: 0.1
  layer_timing: false
training:
  split: training
  iterations: 1500
  seed: 42
  device: cuda:0
logging:
  wandb: true
  wandb_project: compressarc
  wandb_entity: arc_agi
  wandb_tags: [pilot8, final, full-training]
